<title id="title">A coloring invariant for the mutilated chessboard</title>
<desc id="desc">Two diagonally opposite dark corners are removed from an eight by eight board. Thirty dark and thirty-two light squares remain. Every domino covering edge-adjacent squares contains one square of each color, so no domino tiling exists.</desc>
