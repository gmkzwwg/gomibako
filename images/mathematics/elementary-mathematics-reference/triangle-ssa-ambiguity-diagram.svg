<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:xlink="http://www.w3.org/1999/xlink" width="777.6pt" height="446.4pt" viewBox="0 0 777.6 446.4" version="1.1" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">SSA data can leave two possible triangles</title>
<desc id="figure-description">A is at (0,0) and C is at (5 square root of 3,5), so AC=10 and the ray from A makes an angle pi over six with AC. The lower half of the circle of radius 7 about C meets that ray at B1 and B2. AB1=5 square root of 3 minus 2 square root of 6; AB2=5 square root of 3 plus 2 square root of 6. Both triangles satisfy the same SSA data.</desc>
