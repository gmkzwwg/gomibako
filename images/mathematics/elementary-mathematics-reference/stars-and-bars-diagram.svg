<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">Stars and bars for three labeled boxes</title><desc id="desc">Eight identical objects allocated as (4,1,3) are encoded by four stars, a bar, one star, a bar, and three stars. Choosing two bar positions among ten gives 45 unrestricted allocations. The capacity restriction in the text reduces the count to 15.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="480" y="34" font-size="24" fill="#172b4d" text-anchor="middle">An allocation and its stars-and-bars encoding</text><text x="480" y="65" font-size="17" fill="#475569" text-anchor="middle">Eight identical objects, three labeled boxes</text><rect x="55" y="100" width="250" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><polygon points="95.00,128.00 99.70,140.53 113.07,141.13 102.61,149.47 106.17,162.37 95.00,155.00 83.83,162.37 87.39,149.47 76.93,141.13 90.30,140.53" fill="#0369a1"/><polygon points="150.00,128.00 154.70,140.53 168.07,141.13 157.61,149.47 161.17,162.37 150.00,155.00 138.83,162.37 142.39,149.47 131.93,141.13 145.30,140.53" fill="#0369a1"/><polygon points="205.00,128.00 209.70,140.53 223.07,141.13 212.61,149.47 216.17,162.37 205.00,155.00 193.83,162.37 197.39,149.47 186.93,141.13 200.30,140.53" fill="#0369a1"/><polygon points="260.00,128.00 264.70,140.53 278.07,141.13 267.61,149.47 271.17,162.37 260.00,155.00 248.83,162.37 252.39,149.47 241.93,141.13 255.30,140.53" fill="#0369a1"/><text x="180" y="222" font-size="18" fill="#0369a1" text-anchor="middle">Box 1: 4 objects</text><rect x="355" y="100" width="250" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><polygon points="480.00,128.00 484.70,140.53 498.07,141.13 487.61,149.47 491.17,162.37 480.00,155.00 468.83,162.37 472.39,149.47 461.93,141.13 475.30,140.53" fill="#7c3aed"/><text x="480" y="222" font-size="18" fill="#7c3aed" text-anchor="middle">Bo