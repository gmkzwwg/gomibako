<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Lattice paths and Vandermonde counting</title><desc id="desc">A path from (0,0) to (8,4) crosses x+y=5 at (3,2). Its first five steps have two north steps and its remaining seven steps have two north steps. Five possible crossing points classify all paths. The class sizes are 35,175,210,70,5 and total 495.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="480" y="34" font-size="24" fill="#172b4d" text-anchor="middle">Counting paths by their crossing of x + y = 5</text><text x="480" y="65" font-size="17" fill="#475569" text-anchor="middle">Each path uses eight east steps and four north steps.</text><line x1="100" y1="168" x2="100" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="100" y="504" font-size="14" fill="#475569" text-anchor="middle">0</text><line x1="178" y1="168" x2="178" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="178" y="504" font-size="14" fill="#475569" text-anchor="middle">1</text><line x1="256" y1="168" x2="256" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="256" y="504" font-size="14" fill="#475569" text-anchor="middle">2</text><line x1="334" y1="168" x2="334" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="334" y="504" font-size="14" fill="#475569" text-anchor="middle">3</text><line x1="412" y1="168" x2="412" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="412" y="504" font-size="14" fill="#475569" text-anchor="middle">4</text><line x1="490" y1="168" x2="490" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="490" y="504" font-size="14" fill="#475569" text-anchor="middle">5</text><line x1="568" y1="168" x2="568" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="568" y="504" font-size="14" fill="#475569" text-anchor="middle">6</text><line x1="646" y1="168" x2="646" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="646" y="504" font-size="14" fill="#475569" text-anchor="middle">7</text><line x1="724" y1="168" x2="724" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="724" y="504" font-size="14" fill="#475569" text-anchor="middle">8</text><line x1="100" y1="480" x2="724" y2="480" stroke="#e2e8f0" stroke-width="1" /><text x="81" y="485" font-size="14" fill="#475569" text-anchor="end">0</text><line x1="100" y1="402" x2="724" y2="402" stroke="#e2e8f0" stroke-width="1" /><text x="81" y="407" font-size="14" fill="#475569" text-anchor="end">1</text><line x1="100" y1="324" x2="724" y2="324" stroke="#e2e8f0" stroke-width="1" /><text x="81" y="329" font-size="14" fill="#475569" text-anchor="end">2</text><line x1="100" y1="246" x2="724" y2="246" stroke="#e2e8f0" stroke-width="1" /><text x="81" y="251" font-size="14" fill="#475569" text-anchor="end">3</text><line x1="100" y1="168" x2="724" y2="168" stroke="#e2e8f0" stroke-width="1" /><text x="81" y="173" font-size="14" fill="#475569" text-anchor="end">4</text><circle cx="100" cy="480" r="2" fill="#cbd5e1"/><circle cx="100" cy="402" r="2" fill="#cbd5e1"/><circle cx="100" cy="324" r="2" fill="#cbd5e1"/><circle cx="100" cy="246" r="2" fill="#cbd5e1"/><circle cx="100" cy="168" r="2" fill="#cbd5e1"/><circle cx="178" cy="480" r="2" fill="#cbd5e1"/><circle cx="178" cy="402" r="2" fill="#cbd5e1"/><circle cx="178" cy="324" r="2" fill="#cbd5e1"/><circle cx="178" cy="246" r="2" fill="#cbd5e1"/><circle cx="178" cy="168" r="2" fill="#cbd5e1"/><circle cx="256" cy="480" r="2" fill="#cbd5e1"/><circle cx="256" cy="402" r="2" fill="#cbd5e1"/><circle cx="256" cy="324" r="2" fill="#cbd5e1"/><circle cx="256" cy="246" r="2" fill="#cbd5e1"/><circle cx="256" cy="168" r="2" fill="#cbd5e1"/><circle cx="334" cy="480" r="2" fill="#cbd5e1"/><circle cx="334" cy="402" r="2" fill="#cbd5e1"/><circle cx="334" cy="324" r="2" fill="#cbd5e1"/><circle cx="334" cy="246" r="2" fill="#cbd5e1"/><circle cx="334" cy="168" r="2" fill="#cbd5e1"/><circle cx="412" cy="480" r="2" fill="#cbd5e1"/><circle cx="412" cy="402" r="2" fill="#cbd5e1"/><circle cx="412" cy="324" r="2" fill="#cbd5e1"/><circle cx="412" cy="246" r="2" fill="#cbd5e1"/><circle cx="412" cy="168" r="2" fill="#cbd5e1"/><circle cx="490" cy="480" r="2" fill="#cbd5e1"/><circle cx="490" cy="402" r="2" fill="#cbd5e1"/><circle cx="490" cy="324" r="2" fill="#cbd5e1"/><circle cx="490" cy="246" r="2" fill="#cbd5e1"/><circle cx="490" cy="168" r="2" fill="#cbd5e1"/><circle cx="568" cy="480" r="2" fill="#cbd5e1"/><circle cx="568" cy="402" r="2" fill="#cbd5e1"/><circle cx="568" cy="324" r="2" fill="#cbd5e1"/><circle cx="568" cy="246" r="2" fill="#cbd5e1"/><circle cx="568" cy="168" r="2" fill="#cbd5e1"/><circle cx="646" cy="480" r="2" fill="#cbd5e1"/><circle cx="646" cy="402" r="2" fill="#cbd5e1"/><circle cx="646" cy="324" r="2" fill="#cbd5e1"/><circle cx="646" cy="246" r="2" fill="#cbd5e1"/><circle cx="646" cy="168" r="2" fill="#cbd5e1"/><circle cx="724" cy="480" r="2" fill="#cbd5e1"/><circle cx="724" cy="402" r="2" fill="#cbd5e1"/><circle cx="724" cy="324" r="2" fill="#cbd5e1"/><circle cx="724" cy="246" r="2" fill="#cbd5e1"/><circle cx="724" cy="168" r="2" fill="#cbd5e1"/><line x1="178" y1="168" x2="490" y2="480" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/><text x="177" y="140" font-size="18" fill="#b45309" text-anchor="middle">x + y = 5</text><text x="724" y="146" font-size="17" fill="#172b4d" text-anchor="middle">(8,4)</text><text x="100" y="537" font-size="17" fill="#172b4d" text-anchor="middle">(0,0)</text><polyline points="100,480 178,480 178,402 256,402 256,324 334,324" fill="none" stroke="#0369a1" stroke-width="5" stroke-linejoin="round"/><polyline points="334,324 412,324 490,324 490,246 568,246 568,168 646,168 724,168" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linejoin="round"/><circle cx="490" cy="480" r="6" stroke="#b45309" stroke-width="2" fill="white"/><circle cx="412" cy="402" r="6" stroke="#b45309" stroke-width="2" fill="white"/><circle cx="334" cy="324" r="6" stroke="#b45309" stroke-width="2" fill="white"/><circle cx="256" cy="246" r="6" stroke="#b45309" stroke-width="2" fill="white"/><circle cx="178" cy="168" r="6" stroke="#b45309" stroke-width="2" fill="white"/><circle cx="334" cy="324" r="9" stroke="#172b4d" stroke-width="2" fill="white"/><line x1="343" y1="316" x2="374" y2="291" stroke="#172b4d" stroke-width="1" /><text x="381" y="287" font-size="18" fill="#172b4d" text-anchor="start">k = 2</text><line x1="780" y1="211" x2="810" y2="211" stroke="#0369a1" stroke-width="4" /><text x="780" y="240" font-size="17" fill="#0369a1" text-anchor="start">First 5 steps</text><text x="780" y="265" font-size="14" fill="#475569" text-anchor="start">2 north, 3 east</text><line x1="780" y1="311" x2="810" y2="311" stroke="#7c3aed" stroke-width="4" /><text x="780" y="340" font-size="17" fill="#7c3aed" text-anchor="start">Last 7 steps</text><text x="780" y="365" font-size="14" fill="#475569" text-anchor="start">2 north, 5 east</text><text x="724" y="537" font-size="15" fill="#475569" text-anchor="middle">east steps</text><text x="100" y="116" font-size="15" fill="#475569" text-anchor="middle">north steps</text><text x="480" y="581" font-size="19" fill="#172b4d" text-anchor="middle">For k = 2: 10 prefixes × 21 suffixes = 210 paths.</text><text x="480" y="616" font-size="18" fill="#475569" text-anchor="middle">All cases: 35 + 175 + 210 + 70 + 5 = 495 paths.</text></g></svg>
