<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Bisection: existence and a certified error</title>
<desc id="desc">The graph of x cubed minus x minus one changes sign between 1 and 2. Six nested brackets share the same horizontal scale, with their negative and positive endpoints colored blue and purple. The limiting root is approximately 1.324718. After ten halvings the bracket is 1356/1024 to 1357/1024 and its midpoint error is less than 1/2048.</desc>
