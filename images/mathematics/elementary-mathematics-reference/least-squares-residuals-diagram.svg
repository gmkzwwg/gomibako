<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title desc">
<title id="title">Least squares and vertical residuals</title>
<desc id="desc">Observed points zero one, one two, and two two are fitted by y hat equals seven sixths plus x over two. Vertical residuals are negative one sixth, one third, and negative one sixth. Their sum and their inner product with the predictor values are zero. The squared error is one sixth and R squared is three quarters. Orthogonality concerns the three-dimensional vectors of observations.</desc>
<rect width="960" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="35.000" y="38.000" font-size="24" fill="#172a3a" text-anchor="start" font-weight="bold">Least squares: fit the line, inspect the residuals</text>
<text x="35.000" y="67.000" font-size="16" fill="#536777" text-anchor="start" font-weight="normal">Observed points: (0, 1), (1, 2), (2, 2);     fitted line: ŷ = 7/6 + x/2</text>
<line x1="80.000" y1="361.000" x2="630.000" y2="361.000" stroke="#dce5ec" stroke-width="1"/>
<text x="67.000" y="365.000" font-size="13" fill="#536777" text-anchor="end" font-weight="normal">1</text>
<line x1="80.000" y1="291.000" x2="630.000" y2="291.000" stroke="#dce5ec" stroke-width="1"/>
<text x="67.000" y="295.000" font-size="13" fill="#536777" text-anchor="end" font-weight="normal">1.5</text>
<line x1="80.000" y1="221.000" x2="630.000" y2="221.000" stroke="#dce5ec" stroke-width="1"/>
<text x="67.000" y="225.000" font-size="13" fill="#536777" text-anchor="end" font-weight="normal">2</text>
<line x1="80.000" y1="151.000" x2="630.000" y2="151.000" stroke="#dce5ec" stroke-width="1"/>
<text x="67.000" y="155.000" font-size="13" fill="#536777" text-anchor="end" font-weight="normal">2.5</text>
<line x1="135.000" y1="137.000" x2="135.000" y2="417.000" stroke="#dce5ec" stroke-width="1"/>
<text x="135.000" y="439.000" font-size="13" fill="#536777" text-anchor="middle" font-weight="normal">0</text>
<line x1="355.000" y1="137.000" x2="355.000" y2="417.000" stroke="#dce5ec" stroke-width="1"/>
<text x="355.000" y="439.000" font-size="13" fill="#536777" text-anchor="middle" font-weight="normal">1</text>
<line x1="575.000" y1="137.000" x2="575.000" y2="417.000" stroke="#dce5ec" stroke-width="1"/>
<text x="575.000" y="439.000" font-size="13" fill="#536777" text-anchor="middle" font-weight="normal">2</text>
<text x="646.000" y="439.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">x</text>
<text x="62.000" y="128.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">y</text>
<path d="M80.000,355.167 L630.000,180.167" fill="none" stroke="#7651b5" stroke-width="2.8" stroke-linejoin="round"/>
<line x1="135.000" y1="361.000" x2="135.000" y2="337.667" stroke="#b66d0c" stroke-width="3.5"/>
<circle cx="135.000" cy="337.667" r="5" fill="white" stroke="#7651b5" stroke-width="2"/>
<circle cx="135.000" cy="361.000" r="5" fill="#2374ab"/>
<text x="150.000" y="354.333" font-size="15" fill="#b66d0c" text-anchor="start" font-weight="bold">−1/6</text>
<line x1="355.000" y1="221.000" x2="355.000" y2="267.667" stroke="#b66d0c" stroke-width="3.5"/>
<circle cx="355.000" cy="267.667" r="5" fill="white" stroke="#7651b5" stroke-width="2"/>
<circle cx="355.000" cy="221.000" r="5" fill="#2374ab"/>
<text x="370.000" y="249.333" font-size="15" fill="#b66d0c" text-anchor="start" font-weight="bold">1/3</text>
<line x1="575.000" y1="221.000" x2="575.000" y2="197.667" stroke="#b66d0c" stroke-width="3.5"/>
<circle cx="575.000" cy="197.667" r="5" fill="white" stroke="#7651b5" stroke-width="2"/>
<circle cx="575.000" cy="221.000" r="5" fill="#2374ab"/>
<text x="590.000" y="214.333" font-size="15" fill="#b66d0c" text-anchor="start" font-weight="bold">−1/6</text>
<rect x="680.000" y="138.000" width="245.000" height="280.000" rx="10" fill="#eef3f7"/>
<text x="700.000" y="170.000" font-size="18" fill="#172a3a" text-anchor="start" font-weight="bold">Normal equations</text>
<text x="700.000" y="207.000" font-size="19" fill="#172a3a" text-anchor="start" font-weight="normal">Σ eᵢ = 0</text>
<text x="700.000" y="244.000" font-size="19" fill="#172a3a" text-anchor="start" font-weight="normal">Σ xᵢeᵢ = 0</text>
<line x1="700.000" y1="269.000" x2="905.000" y2="269.000" stroke="#cad7e0" stroke-width="1"/>
<text x="700.000" y="303.000" font-size="19" fill="#172a3a" text-anchor="start" font-weight="normal">SSE = 1/6</text>
<text x="700.000" y="341.000" font-size="19" fill="#172a3a" text-anchor="start" font-weight="normal">SST = 2/3</text>
<text x="700.000" y="382.000" font-size="20" fill="#7651b5" text-anchor="start" font-weight="bold">R² = 3/4</text>
<circle cx="45.000" cy="479.000" r="5" fill="#2374ab"/>
<text x="58.000" y="484.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">observation</text>
<circle cx="230.000" cy="479.000" r="5" fill="white" stroke="#7651b5" stroke-width="2"/>
<text x="243.000" y="484.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">fitted value</text>
<line x1="420.000" y1="468.000" x2="420.000" y2="489.000" stroke="#b66d0c" stroke-width="3.5"/>
<text x="433.000" y="484.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">vertical residual</text>
<line x1="650.000" y1="479.000" x2="680.000" y2="479.000" stroke="#7651b5" stroke-width="2.8"/>
<text x="692.000" y="484.000" font-size="14" fill="#536777" text-anchor="start" font-weight="normal">fitted line</text>
<text x="480.000" y="537.000" font-size="15" fill="#172a3a" text-anchor="middle" font-weight="normal">The normal equations express orthogonality in the space of the three observations.</text>
</g>
</svg>